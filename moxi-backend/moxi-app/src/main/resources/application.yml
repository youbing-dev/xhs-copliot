server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: moxi-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:moxi}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 3000ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: ${JWT_SECRET:moxi-secret-key-must-be-at-least-32-characters-long-for-hs512}
  access-token-expire: 7200000   # 2小时
  refresh-token-expire: 604800000 # 7天

# AI 配置
ai:
  qwen:
    api-key: ${QWEN_API_KEY:}
    base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
    model: ${QWEN_MODEL:qwen-turbo}
    timeout-ms: ${QWEN_TIMEOUT_MS:120000}
    enabled: ${QWEN_ENABLED:false}
  mock:
    enabled: ${AI_MOCK_ENABLED:true}  # 有 API key 时自动走真实调用

# Resilience4j 熔断配置
resilience4j:
  circuitbreaker:
    instances:
      qwen:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        sliding-window-type: COUNT_BASED

# SpringDoc OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

# 日志
logging:
  level:
    com.moxi: DEBUG
    org.springframework.security: DEBUG

# Agent 配置
agent:
  mode: ${AGENT_MODE:python}                          # python | java
  python-service-url: ${AGENT_PYTHON_URL:http://localhost:8001}
  internal-secret: ${AGENT_INTERNAL_SECRET:moxi-internal-2024}
  timeout-ms: ${AGENT_TIMEOUT_MS:120000}              # Agent 超时时间（2分钟）
