version: '3.8'

# 独立开发调试用 compose：只拉起 redis + moxi-agent，
# 便于在不启动整套 Java 后端的情况下调试 Python Agent 服务。
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  moxi-agent:
    build: .
    ports:
      - "8001:8001"
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-sk-xxx}
      - REDIS_URL=redis://redis:6379/1
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - JAVA_SERVICE_URL=http://host.docker.internal:8080
    volumes:
      - ./data/chroma:/app/data/chroma
      - ./data/traces:/app/data/traces
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

volumes:
  redis-data:
